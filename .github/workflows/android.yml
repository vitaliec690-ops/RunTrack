name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Install Android SDK + Build Tools
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install platforms
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      # Detectăm unde e proiectul (căutăm gradlew)
      - name: Detect project dir
        id: detect
        run: |
          set -e
          if [ -f gradlew ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            echo "Using root as project dir"
          else
            CANDIDATE=$(find . -maxdepth 4 -type f -name gradlew | head -n1 | xargs -I{} dirname {})
            if [ -z "$CANDIDATE" ]; then
              echo "❌ gradlew not found in repo"; exit 1
            fi
            echo "PROJECT_DIR=$CANDIDATE" >> $GITHUB_ENV
            echo "Using PROJECT_DIR=$CANDIDATE"
          fi
          echo "Listing project dir:"
          ls -la "$CANDIDATE" 2>/dev/null || ls -la .

      - name: Make gradlew executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Inject MAPS_API_KEY in Manifest (CI-only)
        if: env.MAPS_API_KEY != ''
        run: |
          # încercăm întâi calea standard
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            # căutăm un manifest în submodule, dacă structura diferă
            MANIFEST=$(find "$PROJECT_DIR" -path "*/src/main/AndroidManifest.xml" | head -n1 || true)
          fi
          if [ -n "$MANIFEST" ] && [ -f "$MANIFEST" ]; then
            sed -i 's|\${MAPS_API_KEY}|'"${MAPS_API_KEY}"'|g' "$MANIFEST"
            echo "Injected MAPS_API_KEY into $MANIFEST"
          else
            echo "⚠️ Manifest not found; skipping MAPS_API_KEY injection"
          fi

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean :app:assembleDebug --stacktrace --no-daemon

      - name: Show manifest merge report (only if failed)
        if: failure()
        run: |
          REPORT=$(find "$PROJECT_DIR" -path "*/build/outputs/logs/manifest-merger-debug-report.txt" | head -n1 || true)
          if [ -n "$REPORT" ]; then
            echo "==== Manifest Merge Report ===="
            cat "$REPORT" || true
          else
            echo "No manifest merge report found."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}//build/outputs/apk//**/*.apk
