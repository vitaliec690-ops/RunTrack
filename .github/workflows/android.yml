name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK + Build Tools
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install required platforms & build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # CI fallback pentru MAPS_API_KEY ca să nu mai pice manifest merger
      - name: Inject MAPS_API_KEY in Manifest (CI only)
        env:
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          FILE="app/src/main/AndroidManifest.xml"
          if [ -f "$FILE" ]; then
            KEY="${MAPS_KEY:-FAKE_KEY_FOR_DEBUG}"
            # înlocuiește fie ${MAPS_API_KEY}, fie <MAPS_API_KEY>
            sed -i -E 's/android:value="\$\{MAPS_API_KEY\}"/android:value="REPLACE_KEY"/g' "$FILE" || true
            sed -i -E 's/android:value="<MAPS_API_KEY>"/android:value="REPLACE_KEY"/g' "$FILE" || true
            sed -i -E "s/REPLACE_KEY/${KEY//\//\\/}/g" "$FILE" || true
          fi

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
