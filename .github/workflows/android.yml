name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Install Android SDK + Build Tools
        uses: android-actions/setup-android@v3

      - name: Install required platforms & build-tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # CI-only replace: pune cheia în Manifest dacă există secretul
      - name: Inject MAPS_API_KEY in Manifest (CI-only)
        if: env.MAPS_API_KEY != ''
        run: |
          sed -i 's|\${MAPS_API_KEY}|'"${MAPS_API_KEY}"'|g' app/src/main/AndroidManifest.xml
          echo "Injected MAPS_API_KEY into AndroidManifest.xml"

      - name: Build Debug APK
        run: ./gradlew clean :app:assembleDebug --stacktrace --no-daemon

      - name: Show manifest merge report (only if failed)
        if: failure()
        run: |
          cat app/build/outputs/logs/manifest-merger-debug-report.txt || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
