name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - 'app/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: .
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK + Build Tools
        uses: android-actions/setup-android@v3
        with:
          packages: |
            build-tools;34.0.0
            platforms;android-34
            platforms;android-33
            platform-tools
            extras;google;m2repository
            extras;android;m2repository

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      # Generează GRADLE WRAPPER în CI (nu mai trebuie local)
      - name: Generate Gradle wrapper (if missing)
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4
          build-root-directory: ${{ env.PROJECT_DIR }}
          arguments: wrapper --gradle-version 8.4

      - name: Make gradlew executable
        run: chmod +x $PROJECT_DIR/gradlew

      # Opțional: injectează cheia Maps dacă ai placeholder în manifest
      - name: Inject MAPS_API_KEY in Manifest (CI only)
        if: ${{ secrets.MAPS_API_KEY != '' }}
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if grep -q 'MAPS_API_KEY' "$MANIFEST"; then
            sed -i 's/\${MAPS_API_KEY}/'"${{ secrets.MAPS_API_KEY }}"'/' "$MANIFEST"
          fi

      - name: Build Debug APK
        run: $PROJECT_DIR/gradlew -p $PROJECT_DIR assembleDebug

      - name: Show manifest merge report (if exists)
        if: always()
        run: |
          REPORT="$PROJECT_DIR/app/build/outputs/logs/manifest-merger-debug-report.txt"
          [ -f "$REPORT" ] && { echo "---- Manifest merge report ----"; cat "$REPORT"; } || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}//build/outputs/apk//**/*.apk
