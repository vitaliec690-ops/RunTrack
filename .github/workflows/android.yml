name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fix KAPT pe JDK 17 (fără să atingi codul din repo)
      JAVA_TOOL_OPTIONS: >-
        --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
        --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED
        --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED
        --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
        --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
        --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
        --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK 34 + Build-Tools
        run: |
          sudo mkdir -p /usr/lib/android-sdk/cmdline-tools
          sudo chown -R $USER /usr/lib/android-sdk
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d /usr/lib/android-sdk/cmdline-tools
          mv /usr/lib/android-sdk/cmdline-tools/cmdline-tools /usr/lib/android-sdk/cmdline-tools/latest
          yes | /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=/usr/lib/android-sdk" >> $GITHUB_ENV
          echo "/usr/lib/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Provide MAPS_API_KEY to build (fără să modificăm codul)
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> local.properties
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> secrets.properties

      # DACA pică cu "Invalid catalog definition" (dubluri în libs.versions.toml),
      # decomentează blocul următor ca să rescrie DOAR în runner (nu în repo):
      # - name: (OPTIONAL) Fix duplicate version catalog
      #   run: |
      #     cat > gradle/libs.versions.toml <<'EOF'
      #     [versions]
      #     agp="8.3.0"; kotlin="1.9.24"
      #     activity-compose="1.7.2"; compose-bom="2023.06.01"; core-ktx="1.10.1"
      #     androidx-junit="1.1.5"; espresso-core="3.5.1"; junit="4.13.2"
      #     lifecycle="2.6.1"; coil-compose="2.4.0"; hilt="2.49"; hilt-navigation-compose="1.0.0"
      #     kotlin-bom="1.8.0"; navigation-compose="2.7.6"
      #     maps-compose="5.0.3"; play-services-location="21.3.0"; play-services-maps="18.2.0"
      #     timber="5.0.1"; room="2.6.1"; datastore="1.0.0"; paging="3.2.0"
      #     accompanist-permissions="0.31.5-beta"; maps-secret="2.0.1"; vico="2.0.0-alpha.12"
      #     [plugins]
      #     android-application = { id = "com.android.application", version.ref = "agp" }
      #     jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
      #     jetbrains-kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
      #     maps-secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "maps-secret" }
      #     dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
      #     EOF

      - name: Build Debug APK
        run: ./gradlew clean :app:assembleDebug -PMAPS_API_KEY="${{ secrets.MAPS_API_KEY }}" --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
