name: Android APK

on:
  workflow_dispatch:        # îl poți porni manual din Actions
  push:
    branches: [ main ]      # rulează și la push pe main

env:
  # dacă proiectul tău e într-un subfolder (ex. "run-track-master"), pune-l aici.
  # Dacă proiectul e chiar în rădăcina repo-ului, lasă ".".
  WORKING_DIR: "."

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: ${{ env.WORKING_DIR }}

      # Acceptă licențe + se asigură că SDK-ul minim există
      - name: Install Android SDK + Build Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      # (OPȚIONAL) Injectează MAPS_API_KEY în manifest dacă ai placeholder <MAPS_API_KEY>
      - name: Inject MAPS_API_KEY in Manifest (CI only)
        if: ${{ secrets.MAPS_API_KEY != '' }}
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          FILE="${{ env.WORKING_DIR }}/app/src/main/AndroidManifest.xml"
          if grep -q "<MAPS_API_KEY>" "$FILE"; then
            sed -i.bak "s#<MAPS_API_KEY>#${MAPS_API_KEY}#g" "$FILE"
            echo "MAPS_API_KEY injected."
          else
            echo "No <MAPS_API_KEY> placeholder found. Skipping."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ${{ env.WORKING_DIR }}

      # Arată raportul de manifest dacă a eșuat merge-ul (util pentru debugging)
      - name: Show manifest merge report (only if failed)
        if: failure()
        run: |
          REPORT="${{ env.WORKING_DIR }}/app/build/outputs/logs/manifest-merger-debug-report.txt"
          if [ -f "$REPORT" ]; then
            echo "------ Manifest Merger Report ------"
            cat "$REPORT" || true
          else
            echo "No manifest report found."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: ${{ env.WORKING_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 7
